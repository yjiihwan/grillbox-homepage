<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>그릴박스 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ───────── 로그인 ───────── -->
<main id="login" class="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <div class="login-brand">
      <span class="wordmark">GRILL<span>BOX</span></span>
      <h1>그릴박스 관리자</h1>
      <p>홈페이지의 문구·가격·사진·매장 정보를 수정하는 곳이에요.</p>
    </div>

    <label class="field">
      <span>아이디</span>
      <input type="text" id="login-id" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디" required>
    </label>
    <label class="field">
      <span>비밀번호</span>
      <span class="pw-wrap">
        <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="비밀번호" required>
        <button type="button" class="pw-eye" id="pw-eye" aria-label="비밀번호 보기">보기</button>
      </span>
    </label>

    <label class="check">
      <input type="checkbox" id="login-keep"> <span>로그인 상태 유지 <small>(이 기기에서 30일)</small></span>
    </label>

    <p class="login-msg" id="login-msg" role="alert" hidden>아이디 또는 비밀번호가 올바르지 않습니다.</p>

    <button type="submit" class="btn btn-primary btn-block" id="login-btn">로그인</button>

    <p class="login-foot"><a href="../" target="_blank" rel="noopener">홈페이지 보러 가기 ↗</a></p>
  </form>
</main>

<!-- ───────── 관리자 본문 ───────── -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="./">GRILL<span>BOX</span> <em>관리자</em></a>
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="../" target="_blank" rel="noopener">사이트 보기 ↗</a>
        <span class="user-chip" id="user-chip" title="로그인한 아이디"></span>
        <button type="button" class="btn btn-ghost" id="logout-btn">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="수정할 항목"></nav>
    <section class="content" id="content" aria-live="polite"></section>
  </div>

  <footer class="savebar" id="savebar">
    <div class="savebar-in">
      <div class="save-status" id="save-status">
        <span class="dot" aria-hidden="true"></span>
        <span class="save-text" id="save-text">불러오는 중…</span>
      </div>
      <div class="save-actions">
        <button type="button" class="btn btn-ghost" id="revert-btn" disabled>되돌리기</button>
        <button type="button" class="btn btn-primary" id="save-btn" disabled>저장하기</button>
      </div>
    </div>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="sealbox.js"></script>
<script src="admin.js"></script>
</body>
</html>
